<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Compamax — À bientôt</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #f4f7fc; font-family: system-ui, sans-serif; }
    main { max-width: 640px; text-align: center; }
    .badge { display: inline-block; padding: 8px 14px; border: 1px solid #35465e; border-radius: 999px; color: #8de3c1; font-size: 14px; }
    h1 { margin: 28px 0 12px; font-size: clamp(48px, 10vw, 88px); letter-spacing: -.06em; }
    p { color: #b9c6d9; font-size: 20px; line-height: 1.6; }
    footer { margin-top: 48px; color: #7e91ac; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Un petit quelque chose se prépare</span>
    <h1>Compamax.</h1>
    <p>Pour l’instant, c’est juste une page de test.<br>La suite arrive bientôt.</p>
    <footer>compamax.com</footer>
  </main>
</body>
</html>
